name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: SKILL.md sozdizimi (frontmatter var mi)
        run: |
          for dir in isnad isnad-word isnad-kunye isnad-atiyaz; do
            test -f "$dir/SKILL.md" || { echo "SKILL.md yok: $dir"; exit 1; }
            head -1 "$dir/SKILL.md" | grep -q '^---$' || { echo "frontmatter yok: $dir"; exit 1; }
            echo "ok: $dir"
          done
      - name: Python betigi derleniyor mu
        run: uv run --no-project python -m py_compile isnad-word/scripts/isnad_word.py isnad/scripts/isnad_word.py
      - name: Testler
        run: uv run --no-project --with pytest python -m pytest isnad-word/tests -q
